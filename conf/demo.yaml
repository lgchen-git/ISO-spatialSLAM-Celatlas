# Minimal demo configuration for smoke testing.
# Copy conf/project.template.yaml for a real project config.

project_name: demo_pipeline
analysis_type: template
run_id: demo

samples_tsv: conf/samples.tsv
input_root: data/example
results_root: tmp/smoke-runtime/results
logs_root: tmp/smoke-runtime/logs
tmp_root: tmp/smoke-runtime/tmp
tables_dirname: tables
figures_dirname: figures
reports_dirname: reports
deliverables_dirname: deliverables
editable_dirname: editable
qc_dirname: qc
pipeline_log_dirname: pipeline
checkpoints_dirname: checkpoints
work_dirname: work

execution_profile: local
resume_mode: resume
sample_parallelism: true
max_parallel_samples: 2
threads: 4
memory_gb: 8
keep_tmp: false

enable_preprocess: true
enable_quantify: false
enable_qc: true
enable_report: false

plot_palette: okabe_ito
plot_font_family: Arial
plot_base_size: 10
plot_dpi: 300
plot_width_in: 6
plot_height_in: 4

report_title: Demo Report
report_logo: epi-logo.png
report_style: clean
